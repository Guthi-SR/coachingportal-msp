<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coachingportal MSP – Anmeldung</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;background:#f3f6fa;color:#142b46}
header{background:#142b46;color:white;padding:24px;text-align:center}
main{max-width:1100px;margin:35px auto;padding:0 18px}
section{background:white;border:1px solid #dce5ee;border-radius:14px;padding:28px}
label{display:block;margin:16px 0 7px;font-weight:600}
input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;font:inherit}
input{border:1px solid #b9c8d7}
button{margin-top:16px;border:0;background:#142b46;color:white;cursor:pointer}
button.secondary{background:#45627f}
#dashboard{display:block}#status{margin-top:20px;line-height:1.5} [hidden]{display:none!important}
.portal-shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 90px)}.portal-sidebar{background:#fff;border-right:1px solid #dce5ee;padding:22px 14px;display:flex;flex-direction:column;gap:4px}.portal-sidebar strong{padding:10px 12px}.portal-sidebar a{display:block;padding:12px;color:#142b46;text-decoration:none;border-radius:8px}.portal-sidebar a:hover{background:#f0f4f9}.portal-sidebar a[aria-current="page"]{background:#e8f0f8;font-weight:700}.portal-content{min-width:0}.portal-content main{max-width:1050px;margin:auto;padding:22px}@media(max-width:650px){.portal-shell{grid-template-columns:190px minmax(0,1fr)}.portal-sidebar{padding:12px 6px}.portal-sidebar a{padding:10px 6px;font-size:13px}.portal-content main{padding:12px}}</style>
</head>
<body>
<header><h1>Coachingportal MSP</h1><div>SRG Main-Spessart</div></header>
<main><div id="dashboard" hidden class="portal-shell"><nav class="portal-sidebar" aria-label="Hauptmenü"><strong>Menü</strong><a href="/" aria-current="page">Startseite</a><a href="/verwaltung.html">Schiedsrichterverwaltung</a><a href="/schiedsrichter.html">Schiedsrichter</a><a href="/coach-beobachter-verwaltung.html">Coach-Beobachter-Verwaltung</a><a href="/coach-beobachter.html">Coach-Beobachter</a></nav><section class="portal-content"><h2>Startseite</h2><button id="dashboard-logout">Abmelden</button></section></div><section id="login-section">
<h2>Anmeldung</h2>
<div id="auth-form">
<label for="email">E-Mail-Adresse</label>
<input id="email" type="email" autocomplete="email" required>
<label for="password">Passwort</label>
<input id="password" type="password" autocomplete="current-password">
<button id="login">Anmelden</button>
<button id="magic" class="secondary">Erstzugang per E-Mail</button>
<button id="reset" class="secondary">Passwort zurücksetzen</button>
</div>
<div id="password-form" hidden>
<label for="new-password">Neues Passwort (mindestens 12 Zeichen)</label>
<input id="new-password" type="password" autocomplete="new-password" minlength="12">
<button id="save-password">Passwort speichern</button>
</div>
<div id="account" hidden><h2>Willkommen</h2><p id="role"></p><p id="admin-link" hidden><a href="/verwaltung.html">Schiedsrichterverwaltung öffnen →</a></p><button id="logout">Abmelden</button></div>
<p id="status" role="status" aria-live="polite"></p>
</section></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.4";
const supabase=createClient("https://izuwixrvuxrhviyabgom.supabase.co","sb_publishable_2Cep_1Pu93JXSKVrYzyRQA_5Nbq9XEZ");
const el=id=>document.getElementById(id);
const msg=text=>{el("status").textContent=text};
const email=()=>el("email").value.trim();
const redirect=location.origin+location.pathname;
async function render(){
  const {data:{user},error}=await supabase.auth.getUser();
  if(error||!user){el("auth-form").hidden=false;el("account").hidden=true;el("dashboard").hidden=true;el("login-section").hidden=false;return}
  const {data:profile,error:profileError}=await supabase.from("portal_profiles").select("role").eq("user_id",user.id).single();
  el("auth-form").hidden=true;el("account").hidden=true;el("dashboard").hidden=false;el("login-section").hidden=true;
  el("admin-link").hidden=profileError||profile.role!=="admin";
  el("role").textContent=profileError?"Benutzerprofil noch nicht verfügbar.":profile.role==="admin"?"Administrator":"Coach";
}
el("login").onclick=async()=>{
  if(!email()||!el("password").value)return msg("Bitte E-Mail-Adresse und Passwort eingeben.");
  const {error}=await supabase.auth.signInWithPassword({email:email(),password:el("password").value});
  msg(error?"Anmeldung fehlgeschlagen. Bitte Zugangsdaten prüfen.":"");
  if(!error)await render();
};
el("magic").onclick=async()=>{
  if(!email())return msg("Bitte zuerst deine E-Mail-Adresse eingeben.");
  const {error}=await supabase.auth.signInWithOtp({email:email(),options:{emailRedirectTo:redirect,shouldCreateUser:false}});
  msg(error?"Der Erstzugang konnte nicht angefordert werden. Bitte prüfen, ob dein Konto bereits eingerichtet wurde.":"Falls dein Konto besteht, erhältst du eine E-Mail mit einem Anmeldelink.");
};
el("reset").onclick=async()=>{
  if(!email())return msg("Bitte zuerst deine E-Mail-Adresse eingeben.");
  const {error}=await supabase.auth.resetPasswordForEmail(email(),{redirectTo:redirect});
  msg(error?"Zurücksetzen derzeit nicht möglich.":"Falls dein Konto besteht, erhältst du eine E-Mail.");
};
el("save-password").onclick=async()=>{
  const password=el("new-password").value;
  if(password.length<12)return msg("Bitte mindestens 12 Zeichen verwenden.");
  const {error}=await supabase.auth.updateUser({password});
  if(error)return msg("Das Passwort konnte nicht gespeichert werden.");
  el("password-form").hidden=true;el("new-password").value="";msg("Passwort gespeichert.");await render();
};
el("dashboard-logout").onclick=async()=>{await supabase.auth.signOut();msg("Abgemeldet.");await render()};el("logout").onclick=async()=>{await supabase.auth.signOut();msg("Abgemeldet.");await render()};
supabase.auth.onAuthStateChange(event=>{
  if(event==="PASSWORD_RECOVERY"){el("password-form").hidden=false;el("account").hidden=true;el("auth-form").hidden=true;msg("Bitte jetzt dein neues Passwort festlegen.");}
  else if(event==="SIGNED_IN"||event==="SIGNED_OUT")setTimeout(render,0);
});
await render();
</script>
</body></html>
