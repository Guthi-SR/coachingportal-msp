<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zugang einrichten – Coachingportal MSP</title><style>body{margin:0;background:#f3f6fa;color:#142b46;font:16px system-ui}header{background:#142b46;color:white;padding:18px}main{max-width:650px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #dce5ee;border-radius:12px;padding:20px}a{color:#17568c}label{display:block;margin:14px 0 6px;font-weight:600}select,input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #bdcad8;border-radius:8px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:8px;background:#142b46;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}.hint{font-size:14px;color:#52677a;line-height:1.5}[hidden]{display:none!important}</style></head><body><header><h1>Zugang einrichten</h1>Coachingportal MSP</header><main><p><a href="/">← Zurück zum Dashboard</a></p><div id="access">Administratorzugang wird geprüft …</div><section class="card" id="app" hidden><h2>Coach einladen</h2><label for="coach">Coach auswählen</label><select id="coach"><option value="">Bitte auswählen</option></select><p id="email" class="hint"></p><label for="username">Benutzername festlegen</label><input id="username" maxlength="40" autocomplete="off" placeholder="z. B. test.coach"><p class="hint">Der Coach erhält eine E-Mail mit einem einmaligen Einrichtungslink. Beim ersten Login muss er ein eigenes Passwort mit mindestens 12 Zeichen vergeben.</p><button id="send" type="button">Einladung senden</button><p id="status" role="status" aria-live="polite"></p></section></main><script type="module">import{requireAdmin,sb}from"/portal-workflow.js";import{cloudPeople}from"/portal-people.js";const $=id=>document.getElementById(id);try{const{user}=await requireAdmin();const people=await cloudPeople(user.id,"coach");for(const p of people.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"de"))){const o=document.createElement("option");o.value=p.id;o.textContent=p.name||[p.first,p.last].filter(Boolean).join(" ");$("coach").append(o)}$("coach").onchange=()=>{const p=people.find(p=>p.id===$("coach").value);$("email").textContent=p?"Einladung an: "+(p.mail||p.email||"Keine E-Mail-Adresse hinterlegt"):"";$("status").textContent=""};$("send").onclick=async()=>{const personId=$("coach").value,username=$("username").value.trim();if(!personId)return $("status").textContent="Bitte Coach auswählen.";if(!/^[a-zA-Z0-9._-]{3,40}$/.test(username))return $("status").textContent="Benutzername: 3–40 Zeichen, Buchstaben, Zahlen, Punkt, Bindestrich oder Unterstrich.";const p=people.find(p=>p.id===personId);if(!confirm("Einladung an "+(p?.mail||p?.email||"fehlende Adresse")+" senden?"))return;$("send").disabled=true;$("status").textContent="Einladung wird gesendet …";try{const{data,error}=await sb.functions.invoke("invite-coach",{body:{personId,username}});if(error)throw Error(data?.error||error.message);if(!data?.ok)throw Error(data?.error||"Versand fehlgeschlagen");$("status").textContent="Einladung erfolgreich versendet."}catch(e){$("status").textContent="Fehler: "+e.message}finally{$("send").disabled=false}};$("app").hidden=false;$("access").hidden=true}catch(e){$("access").textContent="Nur für Administratoren zugänglich: "+e.message}</script><script type="module" src="/portal-ui.js"></script></body></html>
