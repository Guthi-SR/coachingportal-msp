<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zugang einrichten – Coachingportal MSP</title><style>body{margin:0;background:#f3f6fa;color:#142b46;font:16px system-ui}header{background:#142b46;color:white;padding:18px}main{max-width:650px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #dce5ee;border-radius:12px;padding:20px}a{color:#17568c}label{display:block;margin:14px 0 6px;font-weight:600}select,input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #bdcad8;border-radius:8px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:8px;background:#142b46;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}.hint{font-size:14px;color:#52677a;line-height:1.5}[hidden]{display:none!important}</style></head><body><header><h1>Benutzerverwaltung</h1>Coachingportal MSP</header><main><p><a href="/">← Zurück zum Dashboard</a></p><div id="access">Administratorzugang wird geprüft …</div><section class="card" id="app" hidden><h2>Neuen Benutzer einladen</h2><label>Vorname</label><input id="first" autocomplete="given-name"><label>Nachname</label><input id="last" autocomplete="family-name"><label>E-Mail-Adresse</label><input id="email" type="email" autocomplete="email"><label>Benutzername</label><input id="username" maxlength="40" placeholder="z. B. max.mustermann"><label>Berechtigungsprofil</label><select id="template"><option value="">Bitte Profil auswählen</option></select><p class="hint">Ohne Berechtigungsprofil kann kein Zugang angelegt werden. <a href="/benutzerprofile.html">Benutzerprofile verwalten</a>. Der Benutzer erhält einen persönlichen Einrichtungslink per E-Mail.</p><button id="send" type="button">Einladung senden</button><p id="status" role="status" aria-live="polite"></p></section></main><script type="module">import{requireAdmin,sb}from"/portal-workflow.js";const $=id=>document.getElementById(id);try{await requireAdmin();const{data,error}=await sb.from("portal_permission_templates").select("id,name").order("name");if(error)throw error;for(const p of data||[])$("template").add(new Option(p.name,p.id));$("send").onclick=async()=>{const body={firstName:$("first").value.trim(),lastName:$("last").value.trim(),email:$("email").value.trim(),username:$("username").value.trim(),templateId:$("template").value};if(!body.firstName||!body.lastName||!body.email||!body.username||!body.templateId){$("status").textContent="Bitte alle Felder ausfüllen und ein Profil auswählen.";return}if(!confirm("Einladung an "+body.email+" mit dem ausgewählten Berechtigungsprofil versenden?"))return;$("send").disabled=true;$("status").textContent="Einladung wird gesendet …";try{const{data,error}=await sb.functions.invoke("invite-portal-user",{body});if(error)throw Error(data?.error||error.message);if(!data?.ok)throw Error(data?.error||"Einladung fehlgeschlagen");$("status").textContent="Einladung erfolgreich versendet."}catch(e){$("status").textContent="Fehler: "+e.message}finally{$("send").disabled=false}};$("app").hidden=false;$("access").hidden=true}catch(e){$("access").textContent="Zugriff fehlgeschlagen: "+e.message}</script><script type="module" src="/portal-ui.js"></script></body></html>
