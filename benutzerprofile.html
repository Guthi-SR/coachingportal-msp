<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benutzerprofile und Rechte</title><style>body{font:16px system-ui;background:#f3f6fa;color:#142b46;margin:0}header{background:#142b46;color:white;padding:18px}main{max-width:850px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:12px;margin:16px 0;border:1px solid #dce5ee}input,select,button{font:inherit;padding:10px;margin:5px;border:1px solid #b9c8d7;border-radius:7px}button{background:#142b46;color:white;cursor:pointer}label{display:block;margin:10px 0}.rights{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}.rights label{padding:8px;background:#f4f7fa;border-radius:6px}a{color:#17568c}</style><header><h1>Benutzerprofile & Zugriffsrechte</h1></header><main><a href="/">← Dashboard</a><p id="status">Zugang wird geprüft …</p><section id="app" hidden><div class="card"><h2>Benutzer anlegen</h2><p>Benutzer separat erfassen, einladen und später ein Profil zuweisen.</p><a href="/zugang-einrichten.html" style="display:inline-block;padding:12px 18px;background:#142b46;color:white;border-radius:8px;text-decoration:none">+ Neuen Benutzer anlegen</a></div><div class="card"><h2>Profil auswählen oder anlegen</h2><select id="profiles"><option value="">Neues Profil</option></select><input id="name" placeholder="Profilname, z. B. Coach"><div class="rights" id="rights"></div><button id="save">Profil speichern</button><button id="duplicate">Als neues Profil speichern</button></div></section></main><script type="module">
import{sb,requireAdmin}from"/portal-workflow.js";
const $=id=>document.getElementById(id);
const rights=[["games_view","Spiele ansehen"],["games_create","Spiele anlegen"],["games_edit","Spiele bearbeiten"],["games_delete","Spiele löschen"],["coaching_planning_view","Coachingplanung ansehen"],["coaching_planning_edit","Coachingplanung bearbeiten"],["reports_view","Bögen ansehen"],["reports_edit","Bögen bearbeiten"],["reports_upload","Bögen hochladen"],["referees_manage","Schiedsrichter verwalten"],["coaches_manage","Coaches verwalten"],["documents_view","Dokumente ansehen"],["documents_upload","Dokumente hochladen"],["documents_release","Dokumente freigeben"],["mail_send","E-Mails versenden"],["users_manage","Benutzer verwalten"]];
let profiles=[];
const message=t=>$("status").textContent=t;
function selected(){return profiles.find(p=>p.id===$("profiles").value)}
function drawRights(){const p=selected();$("name").value=p?.name||"";$("rights").replaceChildren();for(const [key,label] of rights){const row=document.createElement("label"),box=document.createElement("input");box.type="checkbox";box.dataset.right=key;box.checked=!!p?.permissions?.[key];row.append(box," "+label);$("rights").append(row)}}
function values(){return Object.fromEntries([...document.querySelectorAll("[data-right]")].map(x=>[x.dataset.right,x.checked]))}
async function refresh(){const a=await sb.from("portal_permission_templates").select("*").order("name");if(a.error)throw a.error;profiles=a.data||[];drawRights()}
$("profiles").onchange=drawRights;
$("save").onclick=async()=>{const p=selected(),name=$("name").value.trim();if(!name)return message("Profilnamen eingeben.");if(p&&!confirm("Bestehendes Profil aktualisieren? Diese Änderung gilt für ALLE Benutzer mit diesem Profil.\n\nAbbrechen und „Als neues Profil speichern“ wählen, um nur einem Benutzer ein neues Profil zu geben."))return;const payload={name,permissions:values(),updated_at:new Date().toISOString()};const q=p?sb.from("portal_permission_templates").update(payload).eq("id",p.id):sb.from("portal_permission_templates").insert(payload);const {error}=await q;if(error)return message(error.message);await refresh();message("Profil gespeichert.")};
$("duplicate").onclick=async()=>{const name=prompt("Name für das neue Profil:");if(!name?.trim())return;const {error}=await sb.from("portal_permission_templates").insert({name:name.trim(),permissions:values()});if(error)return message(error.message);await refresh();message("Neues Profil angelegt. Weise es nun dem gewünschten Benutzer zu.")};
try{await requireAdmin();await refresh();$("app").hidden=false;message("Profile können angelegt und Benutzern zugewiesen werden.")}catch(e){message("Zugriff fehlgeschlagen: "+e.message)}
</script><script type="module" src="/portal-ui.js"></script></html>
