n=true;$("app").hidden=false;const key="msp-coach-draft-"+user.id;let state;try{state=JSON.parse(localStorage.getItem(key))||{refs:[],docs:[]}}catch{state={refs:[],docs:[]}};if(!state.refs.length){state.refs=[1,2,3].map(n=>({id:"test-sr-"+n,name:"Test-Coach-Beobachter "+n,mail:""}));localStorage.setItem(key,JSON.stringify(state));}const save=()=>localStorage.setItem(key,JSON.stringify(state));const render=()=>{$("rename-ref").replaceChildren(new Option("Coach-Beobachter zum Umbenennen",""));state.refs.forEach(r=>$("rename-ref").add(new Option(r.name,r.id)));$("ref").replaceChildren(new Option("Coach-Beobachter auswählen",""));state.refs.forEach(r=>$("ref").add(new Option(r.name,r.id)));$("rows").replaceChildren();state.docs.forEach(d=>{const tr=document.createElement("tr");const r=state.refs.find(x=>x.id===d.ref);[r?.name||"Unbekannt",d.date,d.file].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});const td=document.createElement("td"),s=document.createElement("select");["Neu","Gelesen","Geprüft","Versendet"].forEach(v=>s.add(new Option(v,v)));s.value=d.status;s.onchange=()=>{d.status=s.value;d.changed=new Date().toISOString();save()};td.append(s);tr.append(td);const last=document.createElement("td");last.textContent=d.changed?new Date(d.changed).toLocaleString("de-DE"):"–";tr.append(last);$("rows").append(tr)})};$("add").onclick=()=>{const last=$("last").value.trim(),first=$("first").value.trim();if(!last||!first)return alert("Bitte Nachname und Vorname eingeben.");const keys=["street","houseNumber","zip","city","birth","mail","phonePrivate","phoneBusiness","phoneMobile","since","club","cardNumber"];state.refs.push({id:crypto.randomUUID(),last,first,name:first+" "+last,...Object.fromEntries(keys.map(k=>[k,$(k).value.trim()]))});save();["last","first",...keys].forEach(k=>$(k).value="");render()};$("rename").onclick=()=>{const r=state.refs.find(x=>x.id===$("rename-ref").value),name=$("rename-name").value.trim();if(!r||!name)return alert("Coach-Beobachter und neuen Namen auswählen.");r.name=name;save();render();$("rename-name").value="";};$("file").addEventListener("change",async()=>{const file=$("file").files[0];if(!file)return;$("scan-status").textContent="PDF wird ausgelesen …";try{const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const page=await pdf.getPage(1);const items=(await page.getTextContent()).items;const lines=new Map();for(const item of items){if(!item.str?.trim())continue;const y=Math.round(item.transform[5]/5)*5;const a=lines.get(y)||[];a.push({x:item.transform[4],str:item.str});lines.set(y,a)}const text=[...lines.entries()].sort((a,b)=>b[0]-a[0]).map(([_,a])=>a.sort((x,y)=>x.x-y.x).map(x=>x.str).join(" ")).join("\n");if(!text.trim())throw Error("Kein durchsuchbarer Text gefunden. Vermutlich ist es ein Scan.");const names=state.refs.filter(r=>text.toLocaleLowerCase("de").includes(r.name.toLocaleLowerCase("de")));if(names.length===1)$("ref").value=names[0].id;const match=text.match(/(?:Spieltag|Datum|Spiel am|Beobachtung am)\s*[:\-]?\s*(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/i)||text.match(/\b(\d{1,2})\.(\d{1,2})\.(20\d{2})\b/);if(match){const [,d,m,y]=match;$("date").value=y+"-"+m.padStart(2,"0")+"-"+d.padStart(2,"0")}const preview=text.slice(0,350).replace(/\s+/g," ");$("scan-status").textContent="Ausgelesen: "+preview+(names.length===1?" | Name eindeutig erkannt.":" | Coach-Beobachter bitte manuell prüfen.")+" Datum bitte prüfen."; }catch(e){$("scan-status").textContent="Auslesen nicht möglich: "+e.message+" Bitte Daten manuell eingeben."}});$("record").onclick=()=>{if(!$("ref").value||!$("date").value||!$("file").files[0])return alert("Schiedsrichter, Datum und PDF auswählen.");state.docs.push({ref:$("ref").value,date:$("date").value,file:$("file").files[0].name,status:"Neu",changed:new Date().toISOString()});save();$("file").value="";render()};render()}}</script></html>
