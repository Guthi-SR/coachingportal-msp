<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beobachtungsbogen ansehen</title><style>html,body{width:100%;height:100%;margin:0;background:#fff}#view{display:none;position:fixed;top:58px;left:0;width:100%;height:calc(100% - 58px);border:0}#toolbar{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;padding:8px 14px;background:#142b46;z-index:5}#back{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border-radius:8px;background:#fff;color:#142b46;text-decoration:none;font:600 15px system-ui,sans-serif}#back:focus-visible{outline:3px solid #77c8ff;outline-offset:2px}#status{box-sizing:border-box;margin:calc(12vh + 58px) auto;padding:22px;max-width:680px;font:16px system-ui;color:#142b46}@media(max-width:700px){html,body{width:100%;max-width:100%;overflow-x:hidden}*,*::before,*::after{box-sizing:border-box}main,section,article,.shell,.content{min-width:0;max-width:100%}img,video,iframe,canvas{max-width:100%;height:auto}input,select,textarea,button{max-width:100%}table{max-width:100%}pre{max-width:100%;overflow-x:auto}nav{max-width:100%}}#pages{display:none;padding:70px 8px 18px;max-width:100%;overflow-x:hidden;background:#e9edf2;min-height:100vh}#pages canvas{display:block;width:100%;height:auto;margin:0 auto 12px;background:white;box-shadow:0 1px 5px #142b4622}@media(max-width:700px){#view{display:none!important}#pages{display:block}#back{font-size:13px;padding:8px 10px}}#review{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}#review button{border:1px solid #fff8;background:#ffffff22;color:#fff;border-radius:7px;padding:8px;font:600 13px system-ui;cursor:pointer}#review button[aria-pressed="true"]{background:#fff;color:#142b46}#review button:disabled{opacity:.6}#reviewMsg{color:#fff;font:12px system-ui}@media(max-width:700px){#toolbar{height:auto;min-height:58px;flex-wrap:wrap;gap:5px;padding:7px}#review{width:100%;margin-left:0}#view{top:104px;height:calc(100% - 104px)}#pages{padding-top:116px}}</style></head><body>
<nav id="toolbar" aria-label="PDF-Navigation"><a id="back" href="/beobachtungsboegen.html">← Zurück zu den Beobachtungsbögen</a><div id="review" role="group" aria-label="Prüfstatus"><button type="button" id="inProgress">In Bearbeitung</button><button type="button" id="approved">Geprüft</button><span id="reviewMsg" role="status"></span></div></nav>
<div id="pages" aria-label="PDF-Seiten"></div><p id="status" role="status">Beobachtungsbogen wird geöffnet …</p><iframe id="view" title="Beobachtungsbogen PDF"></iframe>
<script type="module">
import{requirePermission,viewPdfBlob,observationAssignments,sb,updateGame}from"/portal-workflow.js";
const status=document.getElementById("status"),frame=document.getElementById("view"),pages=document.getElementById("pages");
try{
 const id=new URLSearchParams(location.search).get("pdf");
 if(!id||!(/^[0-9a-f-]{36}$/i.test(id)))throw Error("Kein gültiger Beobachtungsbogen ausgewählt.");
 const{user,ownerId,profile}=await requirePermission("reports_view");
 const{data:canEdit}=profile.role==="admin"?{data:true}:await sb.rpc("portal_has_permission",{check_id:user.id,permission_key:"reports_edit"});
 const allowedLocal=observationAssignments(ownerId).some(x=>x.id===id);
 const{data:found,error:lookupError}=await sb.from("portal_observations").select("document_id").eq("owner_id",ownerId).eq("document_id",id).maybeSingle();
 if(lookupError)throw lookupError;
 if(!allowedLocal&&!found)throw Error("Für diesen Bogen besteht keine Zuordnung.");
 const{data:games,error:gamesError}=await sb.from("portal_games").select("*").eq("owner_id",ownerId);
 if(gamesError)throw gamesError;
 const game=games.find(g=>g.pdf_id===id||observationAssignments(ownerId).some(x=>x.id===id&&x.gameKey===g.game_key));
 const progress=document.getElementById("inProgress"),approved=document.getElementById("approved"),reviewMsg=document.getElementById("reviewMsg");
 if(!canEdit)document.getElementById("review").hidden=true;
 const refreshReview=()=>{progress.setAttribute("aria-pressed",String(!game?.checked_at));approved.setAttribute("aria-pressed",String(!!game?.checked_at))};
 if(!canEdit||!game){progress.disabled=true;approved.disabled=true;reviewMsg.textContent="Bitte zuerst einem Spiel zuordnen."}
 else{
  refreshReview();
  for(const [button,checked] of [[progress,false],[approved,true]])button.addEventListener("click",async()=>{
   progress.disabled=approved.disabled=true;reviewMsg.textContent="Speichern …";
   try{const updated=await updateGame(ownerId,game.game_key,{checked_at:checked?new Date().toISOString():null});Object.assign(game,updated);refreshReview();reviewMsg.textContent="Gespeichert"}
   catch(e){reviewMsg.textContent="Fehler: "+e.message}
   finally{progress.disabled=approved.disabled=false}
  });
 }
 const blob=await viewPdfBlob(ownerId,id);
 if(!(blob instanceof Blob))throw Error("Der Beobachtungsbogen konnte nicht geladen werden.");
 const url=URL.createObjectURL(blob);
 if(matchMedia("(max-width:700px)").matches){
  try{
   const pdfjs=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
   pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
   const pdf=await pdfjs.getDocument({data:await blob.arrayBuffer()}).promise;
   for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n),base=page.getViewport({scale:1});
    const available=Math.max(200,pages.clientWidth-16),scale=available/base.width;
    const pixelRatio=Math.min(window.devicePixelRatio||1,2);
    const viewport=page.getViewport({scale:scale*pixelRatio});
    const canvas=document.createElement("canvas");
    canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
    canvas.style.width=Math.floor(base.width*scale)+"px";
    canvas.style.height=Math.floor(base.height*scale)+"px";
    pages.append(canvas);
    await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
   }
   status.hidden=true;
  }catch(renderError){
   pages.style.display="none";frame.src=url;frame.style.display="block";
   status.textContent="Die angepasste Handyansicht ist nicht verfügbar. Der Bogen wird im PDF-Viewer angezeigt.";
  }
 }else{frame.src=url;frame.style.display="block";status.hidden=true;}
 window.addEventListener("pagehide",()=>URL.revokeObjectURL(url),{once:true});
}catch(e){status.textContent=e.message||"PDF konnte nicht geöffnet werden."}
</script></body></html>
