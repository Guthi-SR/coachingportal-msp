<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beobachtungsbogen – PDF</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}
#pdf{display:none;position:fixed;inset:0;width:100%;height:100%;border:0}
#message{box-sizing:border-box;max-width:720px;margin:12vh auto;padding:20px;font:16px system-ui,sans-serif;color:#142b46}
</style>
</head>
<body>
<p id="message" role="status">Beobachtungsbogen wird geöffnet …</p>
<iframe id="pdf" title="Beobachtungsbogen als PDF"></iframe>
<script type="module">
const message=document.getElementById("message");
function getPdf(id){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open("msp-observation-pdfs",1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains("pdfs"))
        request.result.createObjectStore("pdfs");
    };
    request.onerror=()=>reject(request.error||new Error("PDF-Speicher nicht verfügbar."));
    request.onsuccess=()=>{
      const db=request.result;
      const tx=db.transaction("pdfs","readonly");
      const item=tx.objectStore("pdfs").get(id);
      item.onsuccess=()=>resolve(item.result);
      item.onerror=()=>reject(item.error||new Error("PDF konnte nicht gelesen werden."));
      tx.oncomplete=()=>db.close();
      tx.onerror=()=>db.close();
    };
  });
}
async function show(){
  const pdfId=new URLSearchParams(location.search).get("pdf");
  if(!pdfId)throw new Error("Kein Beobachtungsbogen ausgewählt.");
  const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2.57.4");
  const sb=createClient("https://izuwixrvuxrhviyabgom.supabase.co","sb_publishable_2Cep_1Pu93JXSKVrYzyRQA_5Nbq9XEZ");
  const {data:{user},error:userError}=await sb.auth.getUser();
  if(userError||!user)throw new Error("Bitte zuerst im Coachingportal anmelden.");
  const {data:profile,error:profileError}=await sb.from("portal_profiles").select("role").eq("user_id",user.id).single();
  if(profileError||profile?.role!=="admin")throw new Error("Dieser interne Bogen ist nur für die Administration freigegeben.");
  const assignments=JSON.parse(localStorage.getItem("msp-observation-assignments-"+user.id)||"[]");
  if(!Array.isArray(assignments)||!assignments.some(row=>row.id===pdfId&&row.pdfStored===true))
    throw new Error("Keine passende interne Zuordnung für diesen Beobachtungsbogen gefunden.");
  const blob=await getPdf(pdfId);
  if(!(blob instanceof Blob))throw new Error("Die PDF ist in diesem Browser nicht gespeichert. Bitte den Browser verwenden, in dem sie erfasst wurde.");
  const url=URL.createObjectURL(blob);
  const frame=document.getElementById("pdf");
  frame.src=url;
  frame.style.display="block";
  message.hidden=true;
  window.addEventListener("pagehide",()=>URL.revokeObjectURL(url),{once:true});
}
show().catch(error=>{message.textContent=error?.message||"Beobachtungsbogen konnte nicht geöffnet werden.";});
</script>
</body>
</html>
