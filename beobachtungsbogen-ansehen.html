<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beobachtungsbogen ansehen</title><style>html,body{width:100%;height:100%;margin:0;background:#fff}#view{display:none;position:fixed;inset:0;width:100%;height:100%;border:0}#status{box-sizing:border-box;margin:12vh auto;padding:22px;max-width:680px;font:16px system-ui;color:#142b46}@media(max-width:700px){html,body{width:100%;max-width:100%;overflow-x:hidden}*,*::before,*::after{box-sizing:border-box}main,section,article,.shell,.content{min-width:0;max-width:100%}img,video,iframe,canvas{max-width:100%;height:auto}input,select,textarea,button{max-width:100%}table{max-width:100%}pre{max-width:100%;overflow-x:auto}nav{max-width:100%}}</style></head><body>
<p id="status" role="status">Beobachtungsbogen wird geöffnet …</p><iframe id="view" title="Beobachtungsbogen PDF"></iframe>
<script type="module">
import{requireAdmin,viewPdfBlob,observationAssignments,sb}from"/portal-workflow.js";
const status=document.getElementById("status"),frame=document.getElementById("view");
try{
 const id=new URLSearchParams(location.search).get("pdf");
 if(!id||!(/^[0-9a-f-]{36}$/i.test(id)))throw Error("Kein gültiger Beobachtungsbogen ausgewählt.");
 const{user}=await requireAdmin();
 const allowedLocal=observationAssignments(user.id).some(x=>x.id===id);
 const{data:found,error:lookupError}=await sb.from("portal_observations").select("document_id").eq("owner_id",user.id).eq("document_id",id).maybeSingle();
 if(lookupError)throw lookupError;
 if(!allowedLocal&&!found)throw Error("Für diesen Bogen besteht keine Zuordnung.");
 const blob=await viewPdfBlob(user.id,id);
 if(!(blob instanceof Blob))throw Error("Der Beobachtungsbogen konnte nicht geladen werden.");
 const url=URL.createObjectURL(blob);
 frame.src=url;frame.style.display="block";status.hidden=true;
 window.addEventListener("pagehide",()=>URL.revokeObjectURL(url),{once:true});
}catch(e){status.textContent=e.message||"PDF konnte nicht geöffnet werden."}
</script></body></html>
